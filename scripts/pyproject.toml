[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "social-pain-research"
version = "0.1.0"
description = "Сбор комментариев из социальных платформ и анализ бизнес-болей с помощью правил и SBERT."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
    "Telethon>=1.44,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "sentence-transformers>=5.6,<6",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pymorphy3>=2.0.6,<3",
]

[project.scripts]
collect-comments = "social_comments_solid:main"
analyze-pains = "llm_analyze_solid:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-requests>=2.32,<3",
]

[tool.setuptools]
py-modules = [
    "social_comments_solid",
    "llm_analyze_solid",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501", # Длину строк контролирует форматтер Ruff.
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pymorphy3.*",
    "sentence_transformers.*",
    "telethon.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
